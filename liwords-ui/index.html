<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="utf-8" />
    <!--
      Cascade layer order, declared before any stylesheet loads.

      Layered CSS always loses to unlayered CSS, so app SCSS beats both
      libraries. This statement fixes the order *between* them: Mantine above
      Ant Design. See src/theme/layers.css.

      It lives here rather than in a stylesheet because the bundler splits CSS
      into chunks, and a declaration inside one chunk is not guaranteed to load
      before the @layer blocks in another. Without it the order falls back to
      whichever layer the bundler happens to emit first.
    -->
    <style>
      @layer antd, mantine;
    </style>
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <!-- Prevent translation from picking up single tiles as other words -->
    <meta name="google" content="notranslate" />
    <meta
      name="description"
      content="The home for competitive, real-time word gaming."
    />
    <meta property="og:image" content="https://woogles.io/ksfunded.png" />
    <meta
      property="og:description"
      content="The home for competitive, real-time word gaming."
    />

    <link rel="apple-touch-icon" href="/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="/manifest.json" />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;700;800;900&display=swap"
      rel="stylesheet"
    />
    <!--
      Mulish draws capital I and lowercase l as the same plain stem, so names
      that differ only there cannot be told apart. These faces put IBM Plex
      Sans's capital I (serifed) and lowercase l (tailed) into the Mulish
      family; every other character still comes from Mulish.

      They must come after the Mulish stylesheet: faces with the same
      descriptors are tried in reverse order of definition, so these win for
      their unicode-range. One rule per weight loaded above, because only
      faces with matching descriptors combine that way. Each points at the
      Plex weight whose stems match that Mulish weight, since Plex runs
      heavier (Mulish 700 gets Plex 600). The overrides are Mulish's vertical
      metrics, so a line with an I or an l is no taller where browsers honor
      them.
    -->
    <style>
      @font-face {
        font-family: "Mulish";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url(https://fonts.gstatic.com/s/ibmplexsans/v23/zYXGKVElMYYaJe8bpLHnCwDKr932-G7dytD-Dmu1swZSAXcomDVmadSD6llDB6g4.woff2)
          format("woff2");
        unicode-range: U+0049, U+006C;
        ascent-override: 100.5%;
        descent-override: 25%;
        line-gap-override: 0%;
      }
      @font-face {
        font-family: "Mulish";
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url(https://fonts.gstatic.com/s/ibmplexsans/v23/zYXGKVElMYYaJe8bpLHnCwDKr932-G7dytD-Dmu1swZSAXcomDVmadSD6llDB6g4.woff2)
          format("woff2");
        unicode-range: U+0049, U+006C;
        ascent-override: 100.5%;
        descent-override: 25%;
        line-gap-override: 0%;
      }
      @font-face {
        font-family: "Mulish";
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url(https://fonts.gstatic.com/s/ibmplexsans/v23/zYXGKVElMYYaJe8bpLHnCwDKr932-G7dytD-Dmu1swZSAXcomDVmadSDNF5DB6g4.woff2)
          format("woff2");
        unicode-range: U+0049, U+006C;
        ascent-override: 100.5%;
        descent-override: 25%;
        line-gap-override: 0%;
      }
      @font-face {
        font-family: "Mulish";
        font-style: normal;
        font-weight: 800;
        font-display: swap;
        src: url(https://fonts.gstatic.com/s/ibmplexsans/v23/zYXGKVElMYYaJe8bpLHnCwDKr932-G7dytD-Dmu1swZSAXcomDVmadSDDV5DB6g4.woff2)
          format("woff2");
        unicode-range: U+0049, U+006C;
        ascent-override: 100.5%;
        descent-override: 25%;
        line-gap-override: 0%;
      }
      @font-face {
        font-family: "Mulish";
        font-style: normal;
        font-weight: 900;
        font-display: swap;
        src: url(https://fonts.gstatic.com/s/ibmplexsans/v23/zYXGKVElMYYaJe8bpLHnCwDKr932-G7dytD-Dmu1swZSAXcomDVmadSDDV5DB6g4.woff2)
          format("woff2");
        unicode-range: U+0049, U+006C;
        ascent-override: 100.5%;
        descent-override: 25%;
        line-gap-override: 0%;
      }
    </style>
    <link
      href="https://fonts.googleapis.com/css2?family=Fjalla+One&display=swap"
      rel="stylesheet"
    />
    <script src="/config.js" type="text/javascript"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
    <title>Woogles.io</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
