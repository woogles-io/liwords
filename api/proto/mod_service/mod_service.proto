syntax = "proto3";
package mod_service;

import "proto/ipc/chat.proto";
import "google/protobuf/timestamp.proto";

// Moderation

enum ModActionType {
  MUTE = 0;
  SUSPEND_ACCOUNT = 1;
  SUSPEND_RATED_GAMES = 2;
  SUSPEND_GAMES = 3;
  RESET_RATINGS = 4;
  RESET_STATS = 5;
  RESET_STATS_AND_RATINGS = 6;
  REMOVE_CHAT = 7;
  DELETE_ACCOUNT = 8;
  REMOVE_FIRST_NAME = 9;
  REMOVE_LAST_NAME = 10;
  REMOVE_ABOUT = 11;
  REMOVE_AVATAR = 12;
  // CHANGE_EMAIL: what an admin's ChangeEmail is checked as. It is never
  // stored as an action; the change goes in the email changes.
  CHANGE_EMAIL = 13;
}

enum EmailType {
  DEFAULT = 0;
  CHEATING = 1;
  DELETION = 2;
}

message ModAction {
  string user_id = 1;
  ModActionType type = 2;
  int32 duration = 3;
  google.protobuf.Timestamp start_time = 4;
  google.protobuf.Timestamp end_time = 5;
  google.protobuf.Timestamp removed_time = 6;
  string channel = 7;
  string message_id = 8;
  string applier_user_id = 9;
  string remover_user_id = 10;
  // ChatText: the removed text, kept for the record: the chat message for
  // REMOVE_CHAT, or the cleared field's old value for REMOVE_FIRST_NAME,
  // REMOVE_LAST_NAME, REMOVE_ABOUT, and REMOVE_AVATAR (the avatar's URL).
  string chat_text = 11;
  // Note: an optional note from the moderator.
  string note = 12;
  EmailType email_type = 13;
}

message ModActionsMap { map<string, ModAction> actions = 1; }

message ModActionsList { repeated ModAction actions = 1; }

message GetActionsRequest { string user_id = 1; }

message ModActionResponse {}

// ChangeEmailRequest sets a user's email at once, with no mail to either
// address, and records it in the email changes. Only an admin may.
message ChangeEmailRequest {
  string user_id = 1;
  string email = 2;
}

message ChangeEmailResponse {}

// EmailChange is one change of a user's email, by the user or by an admin.
message EmailChange {
  string old_email = 1;
  string new_email = 2;
  google.protobuf.Timestamp changed_at = 3;
  string changed_by_user_id = 4;
  string changed_by_username = 5;
}

message ListEmailChangesRequest { string user_id = 1; }

// ListEmailChangesResponse lists the changes newest first. Only an admin may
// see them.
message ListEmailChangesResponse { repeated EmailChange changes = 1; }

// Automod

enum NotoriousGameType {
  GOOD = 0;
  NO_PLAY = 1;
  SITTING = 2;
  SANDBAG = 3;
  NO_PLAY_DENIED_NUDGE = 4;
  EXCESSIVE_PHONIES = 5;
}

message NotoriousGame {
  string id = 1;
  NotoriousGameType type = 2;
  google.protobuf.Timestamp created_at = 3;
}

message ResetNotorietyRequest { string user_id = 1; }

message ResetNotorietyResponse {}

message GetNotorietyReportRequest { string user_id = 1; }

message NotorietyReport {
  int32 score = 1;
  repeated NotoriousGame games = 2;
}

// Chat review: read-only views over the chat channels still held in Redis.

message ListChatChannelsRequest {
  // channel_prefix narrows the scan, e.g. "chat.game.", "chat.gametv.",
  // "chat.pm.", "chat.tournament.", "chat.league.". Empty means all.
  string channel_prefix = 1;
  // username, if set, keeps only channels this user chatted in (or, for
  // private chats, is a party to), and adds the chat of every game this user
  // played that may still be in Redis, even where they wrote nothing.
  string username = 2;
  // cursor is the Redis SCAN cursor; empty or "0" starts a new scan.
  string cursor = 3;
  // channels, if set, summarizes exactly these channels instead of scanning.
  repeated string channels = 4;
  // find, if set, names what to summarize the channels of, as channels does:
  // a "chat." channel; or first a game, tournament, club or league by its id
  // or its page's address or path, then always the tournaments, clubs and
  // leagues whose name or slug contains it.
  string find = 5;
  // containing, if set, keeps only channels with a message (one a person sent,
  // not deleted) holding these words, in any case; each summary then says
  // how many do.
  string containing = 6;
}

message ChatSenderCount {
  string user_id = 1;
  string username = 2;
  int32 count = 3;
}

// What a channel is about, decoded from its name.
message ChatChannelContext {
  // e.g. "alice vs bob", "League: Smoke League", "Club: Philly Mondays".
  string label = 1;
  // The site path it belongs to, e.g. /game/<id>, /leagues/<slug>, /club/<x>.
  string link = 2;
  // The people it is between: a private chat's two users, a game's players.
  repeated ChatSenderCount parties = 3;
  // For game channels, in milliseconds: when the game was created and when it
  // was last updated (for a finished game, about when it ended).
  int64 game_created_at = 4;
  int64 game_updated_at = 5;
}

message ChatChannelSummary {
  string channel = 1;
  int32 message_count = 2;
  // in milliseconds, like ChatMessage.timestamp.
  int64 first_timestamp = 3;
  int64 last_timestamp = 4;
  repeated ChatSenderCount senders = 5;
  // user_played is set when the channel belongs to a game the requested user
  // played, whether or not they wrote in it.
  bool user_played = 6;
  ChatChannelContext context = 7;
  // user_last_timestamp is when the requested user last wrote here (0 if
  // never), so channels can be ordered by the user's own last word.
  int64 user_last_timestamp = 8;
  // with a search for words, how many of its messages hold them.
  int32 match_count = 9;
}

message ListChatChannelsResponse {
  repeated ChatChannelSummary channels = 1;
  // next_cursor is "0" when the scan is complete.
  string next_cursor = 2;
}

message GetChannelChatsRequest {
  string channel = 1;
  // a message's id: the page of messages older than it. Empty for the
  // newest page.
  string before = 2;
  // a message's id: the page of messages newer than it.
  string after = 3;
  // a message's id: the page around it, the message with older and newer
  // ones on either side. At most one of before, after and around is set.
  string around = 4;
  // if set, only the messages holding these words, in any case, a page at a
  // time, newest first (with before).
  string containing = 5;
}

// A page of a channel's chats, oldest first. Its field 1 is
// ipc.ChatMessages' own, so either side may be the older one.
message ChannelChats {
  repeated ipc.ChatMessage messages = 1;
  // whether the channel has messages older than this page's first
  bool has_older = 2;
  // whether it has messages newer than this page's last
  bool has_newer = 3;
  // which of this page's messages someone reported
  repeated string reported_ids = 4;
}

message ReportChatMessageRequest {
  // the reported message's id
  string message_id = 1;
}

message ReportChatMessageResponse {}

message GetChatReportsRequest {
  // the handled reports, the most recently handled first, instead of the
  // open ones
  bool handled = 1;
}

// A report of a chat message, open or handled.
message ChatReport {
  int64 id = 1;
  // the reported message: its channel, sender, words and time
  ipc.ChatMessage message = 2;
  // whether a moderator has deleted the message since
  bool deleted = 3;
  string reporter_id = 4;
  string reporter_username = 5;
  google.protobuf.Timestamp reported_at = 6;
  // the moderator who marked it handled, and when; empty while it is open
  string handled_by_id = 7;
  string handled_by_username = 8;
  google.protobuf.Timestamp handled_at = 9;
}

message ChatReports { repeated ChatReport reports = 1; }

message HandleChatReportRequest {
  // the report to mark handled
  int64 report_id = 1;
}

message HandleChatReportResponse {}

message ReopenChatReportRequest {
  // the handled report to open again
  int64 report_id = 1;
}

message ReopenChatReportResponse {}

service ModService {
  rpc ApplyActions(ModActionsList) returns (ModActionResponse);
  rpc RemoveActions(ModActionsList) returns (ModActionResponse);
  rpc GetActions(GetActionsRequest) returns (ModActionsMap);
  rpc GetActionHistory(GetActionsRequest) returns (ModActionsList);
  rpc GetNotorietyReport(GetNotorietyReportRequest) returns (NotorietyReport);
  rpc ResetNotoriety(ResetNotorietyRequest) returns (ResetNotorietyResponse);
  rpc ListChatChannels(ListChatChannelsRequest)
      returns (ListChatChannelsResponse);
  rpc GetChannelChats(GetChannelChatsRequest) returns (ChannelChats);
  rpc ChangeEmail(ChangeEmailRequest) returns (ChangeEmailResponse);
  rpc ListEmailChanges(ListEmailChangesRequest)
      returns (ListEmailChangesResponse);
  // Reports a chat message to the moderators: anyone signed in, any message.
  rpc ReportChatMessage(ReportChatMessageRequest)
      returns (ReportChatMessageResponse);
  // The open reports, newest first, or the handled ones, the most recently
  // handled first (moderators).
  rpc GetChatReports(GetChatReportsRequest) returns (ChatReports);
  // Marks a report handled (moderators).
  rpc HandleChatReport(HandleChatReportRequest)
      returns (HandleChatReportResponse);
  // Opens a handled report again (moderators).
  rpc ReopenChatReport(ReopenChatReportRequest)
      returns (ReopenChatReportResponse);
}