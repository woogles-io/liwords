syntax = "proto3";
package mod_service;

import "proto/ipc/chat.proto";
import "google/protobuf/timestamp.proto";

// Moderation

enum ModActionType {
  MUTE = 0;
  SUSPEND_ACCOUNT = 1;
  SUSPEND_RATED_GAMES = 2;
  SUSPEND_GAMES = 3;
  RESET_RATINGS = 4;
  RESET_STATS = 5;
  RESET_STATS_AND_RATINGS = 6;
  REMOVE_CHAT = 7;
  DELETE_ACCOUNT = 8;
}

enum EmailType {
  DEFAULT = 0;
  CHEATING = 1;
  DELETION = 2;
}

message ModAction {
  string user_id = 1;
  ModActionType type = 2;
  int32 duration = 3;
  google.protobuf.Timestamp start_time = 4;
  google.protobuf.Timestamp end_time = 5;
  google.protobuf.Timestamp removed_time = 6;
  string channel = 7;
  string message_id = 8;
  string applier_user_id = 9;
  string remover_user_id = 10;
  string chat_text = 11;
  // Note: an optional note from the moderator.
  string note = 12;
  EmailType email_type = 13;
}

message ModActionsMap { map<string, ModAction> actions = 1; }

message ModActionsList { repeated ModAction actions = 1; }

message GetActionsRequest { string user_id = 1; }

message ModActionResponse {}

// Automod

enum NotoriousGameType {
  GOOD = 0;
  NO_PLAY = 1;
  SITTING = 2;
  SANDBAG = 3;
  NO_PLAY_DENIED_NUDGE = 4;
  EXCESSIVE_PHONIES = 5;
}

message NotoriousGame {
  string id = 1;
  NotoriousGameType type = 2;
  google.protobuf.Timestamp created_at = 3;
}

message ResetNotorietyRequest { string user_id = 1; }

message ResetNotorietyResponse {}

message GetNotorietyReportRequest { string user_id = 1; }

message NotorietyReport {
  int32 score = 1;
  repeated NotoriousGame games = 2;
}

// Chat review: read-only views over the chat channels still held in Redis.

message ListChatChannelsRequest {
  // channel_prefix narrows the scan, e.g. "chat.game.", "chat.gametv.",
  // "chat.pm.", "chat.tournament.", "chat.league.". Empty means all.
  string channel_prefix = 1;
  // username, if set, keeps only channels this user chatted in (or, for
  // private chats, is a party to).
  string username = 2;
  // cursor is the Redis SCAN cursor; empty or "0" starts a new scan.
  string cursor = 3;
}

message ChatSenderCount {
  string user_id = 1;
  string username = 2;
  int32 count = 3;
}

message ChatChannelSummary {
  string channel = 1;
  int32 message_count = 2;
  // in milliseconds, like ChatMessage.timestamp.
  int64 first_timestamp = 3;
  int64 last_timestamp = 4;
  repeated ChatSenderCount senders = 5;
}

message ListChatChannelsResponse {
  repeated ChatChannelSummary channels = 1;
  // next_cursor is "0" when the scan is complete.
  string next_cursor = 2;
}

message GetChannelChatsRequest { string channel = 1; }

service ModService {
  rpc ApplyActions(ModActionsList) returns (ModActionResponse);
  rpc RemoveActions(ModActionsList) returns (ModActionResponse);
  rpc GetActions(GetActionsRequest) returns (ModActionsMap);
  rpc GetActionHistory(GetActionsRequest) returns (ModActionsList);
  rpc GetNotorietyReport(GetNotorietyReportRequest) returns (NotorietyReport);
  rpc ResetNotoriety(ResetNotorietyRequest) returns (ResetNotorietyResponse);
  rpc ListChatChannels(ListChatChannelsRequest)
      returns (ListChatChannelsResponse);
  rpc GetChannelChats(GetChannelChatsRequest) returns (ipc.ChatMessages);
}