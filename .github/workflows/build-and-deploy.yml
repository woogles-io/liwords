name: Build and Deploy

# Workflow optimization:
# - detect_changes job identifies which parts of the codebase changed
# - Backend jobs (build_api_srv, push_backend_images, check_migration_order) only run if backend files changed
# - Frontend jobs (build_fe, deploy_fe) only run if liwords-ui/ changed
# - Migration job runs on every master deploy (migrations are idempotent)
# This significantly speeds up deployments that only touch one part of the codebase

on:
  push:
    branches:
      - "**"

permissions:
  packages: write

jobs:
  detect_changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend_any_changed }}
      frontend: ${{ steps.filter.outputs.frontend_any_changed }}
      migrations: ${{ steps.filter.outputs.migrations_any_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so a feature branch can be diffed against master.
          fetch-depth: 0

      # Pick what we diff against, explicitly.
      #
      # On master, `github.event.before` is the previous master commit, which is
      # what the deploy jobs want: "what did this push change".
      #
      # On any other branch we instead diff against the merge-base with master,
      # i.e. "what does this branch change". The default per-push behaviour was
      # wrong for branches in two ways:
      #   - the FIRST push of a new branch has an all-zeros before-SHA, so
      #     nothing was detected and every build job skipped;
      #   - detection only saw the most recent push, so a branch that touched
      #     liwords-ui and then landed a docs-only commit would skip build_fe.
      #     The last push decided what got built, not the branch.
      - name: Compute comparison base
        id: base
        run: |
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            base="${{ github.event.before }}"
          else
            base="$(git merge-base origin/master HEAD)"
          fi
          echo "Comparing against $base"
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: Get changed files
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47
        id: filter
        with:
          base_sha: ${{ steps.base.outputs.sha }}
          files_yaml: |
            backend:
              - "api/**"
              - "services/**"
              - "rpc/**"
              - "db/**"
              - "cmd/**"
              - "deploy/**"
              - "pkg/**"
              - "go.mod"
              - "go.sum"
              - "scripts/**"
              # what the Go tests read
              - "data/**"
              - "liwords-ui/wasm-files.json"
            frontend:
              - "liwords-ui/**"
            migrations:
              - "db/migrations/**"

  build_api_srv:
    runs-on: ubuntu-latest
    needs: detect_changes
    if: ${{ needs.detect_changes.outputs.backend == 'true' }}
    env:
      MACONDO_DATA_PATH: ${{ github.workspace }}/data
      TEST_DB_HOST: localhost
      TEST_DB_PREFIX: liwords_test
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: pass
      DB_SSL_MODE: disable
      DB_MIGRATIONS_PATH: file:///${{ github.workspace }}/db/migrations
      REDIS_URL: redis://localhost:6379
    services:
      # Label used to access the service container
      redis:
        # Docker Hub image
        image: redis
        # Set health checks to wait until redis has started
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      postgres:
        # Docker Hub image
        image: postgres
        # Provide the password for postgres
        env:
          POSTGRES_PASSWORD: pass
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # - name: Clone macondo
      #   uses: actions/checkout@v4
      #   with:
      #     repository: domino14/macondo
      #     path: macondo

      # - run: mv $GITHUB_WORKSPACE/macondo /opt/macondo

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # The newest release, as the images were built with golang:latest;
          # ">=1.22" took whatever older Go the runner had cached.
          go-version: stable
          check-latest: true

      - name: Build API
        run: cd cmd/liwords-api && go build

      # The tests read the analyzer's word graphs through data/lexica/gaddag,
      # and git does not keep them. The cache gives back the files as last
      # kept, under this list of them (liwords-ui/wasm-files.json) or an
      # earlier one, and fetch-wasm.mjs fetches only those missing or changed;
      # they are kept again at once, not at the job's end, so a branch whose
      # tests fail keeps them too.
      - name: Name the analyzer's files' directory
        id: wasm
        run: echo "dir=liwords-ui/public/wasm/$(jq -r .dir liwords-ui/wasm-files.json)" >> "${GITHUB_OUTPUT}"

      - name: Restore the analyzer's word graphs
        id: wasm-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.wasm.outputs.dir }}
          key: wasm-${{ hashFiles('liwords-ui/wasm-files.json') }}
          restore-keys: wasm-

      - name: Fetch the analyzer's word graphs
        run: node liwords-ui/scripts/fetch-wasm.mjs --strict

      - name: Keep the analyzer's word graphs
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.wasm.outputs.dir }}
          key: wasm-${{ hashFiles('liwords-ui/wasm-files.json') }}

      - name: Test API
        run: go test -race ./...

      - name: Build Puzzle Generator
        run: cd cmd/puzzlegen && go build

      - name: Build Socket Server
        run: cd cmd/socketsrv && go build

      - name: Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: ./scripts/utilities/notify-discord.sh "liwords backend built successfully for branch {{GITHUB_REF_NAME}}."
        continue-on-error: true

  push_backend_images:
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/master' }}
    needs: build_api_srv
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: domino14
          password: ${{ secrets.GITHUB_TOKEN }}

      # The binaries are compiled on the runner, not in Docker, so this
      # restores the Go module and build caches.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # The newest release, as the images were built with golang:latest;
          # ">=1.22" took whatever older Go the runner had cached.
          go-version: stable
          check-latest: true

      - name: Build and Tag Docker Image
        run: ./deploy/build-and-tag.sh

      - name: Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_EMBEDS: |
            [{
              "title": "🎉 Docker Images Built & Tagged",
              "fields": [
                { "name": "Repository", "value": "[${{github.event.repository.name}}](${{github.event.repository.clone_url}})", "inline": true },
                { "name": "Branch", "value": "[${{github.ref_name}}](https://github.com/${{github.repository}}/tree/${{github.ref_name}})", "inline": true },
                { "name": "APITag", "value": "ghcr.io/woogles-io/liwords-api:${{github.ref_name}}-gh${{github.run_number}}"},
                { "name": "SocketTag", "value": "ghcr.io/woogles-io/liwords-socket:${{github.ref_name}}-gh${{github.run_number}}"}
              ],
              "color": 1127128
            }]
        run: ./scripts/utilities/notify-discord.sh
        continue-on-error: true

  # Migrations run in the deploy (deploy-fargate.yml), once approved. This
  # only stops a master build whose push added a migration numbered below
  # one already on master: golang-migrate would skip it without an error.
  check_migration_order:
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/master' }}
    needs: detect_changes
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check migration order
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "::warning::previous master commit $BEFORE not found; skipping the order check"
            exit 0
          fi
          scripts/check-migration-order.sh "$BEFORE" "$GITHUB_SHA"

      - name: Discord notification (failure)
        if: ${{ failure() }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: >-
          ./scripts/utilities/notify-discord.sh "✗ Migration order check FAILED for branch {{GITHUB_REF_NAME}}:
          a new migration is numbered below one on master. Check GitHub Actions logs."
        continue-on-error: true

  # Deploys the images just built to Fargate: migrations, then the services.
  # Off until the repository variable FARGATE_DEPLOY is "true"; with it on,
  # each build's deploy waits for one of the "production" environment's
  # required reviewers. See deploy-fargate.yml.
  deploy_backend:
    if: ${{ github.ref == 'refs/heads/master' && vars.FARGATE_DEPLOY == 'true' }}
    needs:
      - push_backend_images
      - check_migration_order
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/deploy-fargate.yml
    with:
      image_tag: ${{ github.ref_name }}-gh${{ github.run_number }}
    secrets:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

  build_fe:
    runs-on: ubuntu-latest
    needs: detect_changes
    if: ${{ needs.detect_changes.outputs.frontend == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: true

      - name: Install Dependencies
        run: cd liwords-ui && npm ci

      - name: Test Frontend
        run: cd liwords-ui && npm run test

      # The page asks woogles.io for the analyzer's files, which
      # liwords-ui/scripts/upload-wasm.mjs uploads to the bucket: no page naming
      # them is built, or deployed, before each one is served there with its
      # size and sha256.
      - name: Check the analyzer's files are served
        run: cd liwords-ui && node scripts/fetch-wasm.mjs --check

      - name: Build Frontend
        run: cd liwords-ui && npm run build

      - name: Persist Dist Directory
        uses: actions/upload-artifact@v4
        with:
          path: liwords-ui/dist

      - name: Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: ./scripts/utilities/notify-discord.sh "liwords front-end built successfully for branch {{GITHUB_REF_NAME}}."
        continue-on-error: true

  deploy_fe:
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/master' }}
    needs: build_fe
    permissions:
      contents: read
      # To sign in to AWS as liwordsGithubFrontendRole (aws/cfn/fargate/base.yaml),
      # which only master's jobs of this repository can assume.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Dist Directory
        uses: actions/download-artifact@v4
        with:
          path: /tmp/liwords-ui

      # The hash of the build, which the app compares with what the API
      # reports to tell people with an older version open to reload.
      - name: Calculate UI Hash
        run: |
          UI_HASH=$(find /tmp/liwords-ui/artifact -type f -exec md5sum {} \; | sort -k 2 | md5sum | head -c 32)
          echo "UI hash: $UI_HASH"
          sed -i "s:unknown:${UI_HASH}:" /tmp/liwords-ui/artifact/config.js
          echo "UI_HASH=$UI_HASH" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::509130939211:role/liwordsGithubFrontendRole
          aws-region: us-east-2

      # Uploads the build, index.html last, and expires the files no deploy
      # has served for 30 days. See the script.
      - name: Deploy Frontend to S3
        run: liwords-ui/scripts/deploy-s3.sh /tmp/liwords-ui/artifact "$UI_HASH"

      - name: Update Frontend Hash
        run: |
          echo "Updating frontend hash to: $UI_HASH"
          response=$(curl -f -X POST -H "Content-Type: application/json" \
          -H "X-Api-Key: ${{ secrets.ADMIN_WOOGLES_API_KEY }}" \
          https://woogles.io/api/config_service.ConfigService/SetFEHash \
          -d "{\"hash\": \"$UI_HASH\"}" -w "\n%{http_code}")
          http_code=$(echo "$response" | tail -n1)
          if [ "$http_code" -ne 200 ]; then
            echo "Failed to update frontend hash. HTTP status: $http_code"
            echo "Response: $response"
            exit 1
          fi
          echo "Frontend hash updated successfully"

      - name: Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: ./scripts/utilities/notify-discord.sh "liwords front-end deployed successfully for branch {{GITHUB_REF_NAME}}."
        continue-on-error: true
